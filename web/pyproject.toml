[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nowplaying"
version = "0.1.0"
description = "Unified now-playing web UI for Shairport Sync and Sendspin, via MPRIS"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.9.2",
  "dbus-fast>=2.24.0",
]

[tool.setuptools.packages.find]
include = ["nowplaying*"]

[tool.setuptools.package-data]
nowplaying = ["static/*"]
