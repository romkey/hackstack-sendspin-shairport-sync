[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nowplaying"
version = "0.6.2"
description = "Unified now-playing web UI for Shairport Sync and Sendspin, via MPRIS"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.14.3",
  "dbus-fast>=5.0.22",
  "aiomqtt>=2.5.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pytest-aiohttp>=1.1",
]

[tool.setuptools.packages.find]
include = ["nowplaying*"]

[tool.setuptools.package-data]
nowplaying = ["static/*"]
