<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Now Playing</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#127925;</text></svg>">
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>

  <main id="app" class="idle">
    <div class="art-wrap">
      <img id="art" alt="" hidden>
      <div id="art-placeholder" class="art-placeholder" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
    </div>

    <section class="meta">
      <div id="source" class="badge" hidden></div>
      <h1 id="title">Nothing playing</h1>
      <p id="artist"></p>
      <p id="album"></p>

      <div id="progress" class="progress" hidden>
        <div class="bar"><div id="bar-fill"></div></div>
        <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      </div>
    </section>
  </main>

  <footer>
    <div id="players" class="players"></div>
    <div id="conn" class="conn" data-state="connecting">connecting…</div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
