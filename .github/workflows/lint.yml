name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          # DL3008: we deliberately do not pin Debian package versions, so the
          # weekly rebuild picks up security updates.
          ignore: DL3008

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          # SC1091: the sourced helper is only present inside the image.
          shellcheck -e SC1091 rootfs/usr/local/bin/*.sh scripts/*.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Lint and type-check the web UI
        run: |
          pip install ruff
          ruff check web scripts rootfs
          ruff format --check web scripts rootfs
