name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-release]
  schedule:
    # Weekly rebuild so the image picks up Debian security updates.
    - cron: "17 5 * * 1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read pinned upstream versions
        id: versions
        run: cat versions.env >> "$GITHUB_OUTPUT"

      - name: Decide what to build
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Pull requests only need to prove the image still builds.
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version.shairport-sync=${{ steps.versions.outputs.SHAIRPORT_SYNC_VERSION }}
            org.opencontainers.image.version.nqptp=${{ steps.versions.outputs.NQPTP_VERSION }}
            org.opencontainers.image.version.sendspin=${{ steps.versions.outputs.SENDSPIN_VERSION }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.plan.outputs.platforms }}
          push: ${{ steps.plan.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SHAIRPORT_SYNC_VERSION=${{ steps.versions.outputs.SHAIRPORT_SYNC_VERSION }}
            NQPTP_VERSION=${{ steps.versions.outputs.NQPTP_VERSION }}
            SENDSPIN_VERSION=${{ steps.versions.outputs.SENDSPIN_VERSION }}

      - name: Attest build provenance
        if: steps.plan.outputs.push == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  smoke-test:
    # Boots the freshly built image with audio disabled and checks that the
    # supervised processes come up and the web UI answers.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run smoke test
        run: ./scripts/smoke-test.sh "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)"
