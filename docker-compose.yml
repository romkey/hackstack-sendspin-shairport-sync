services:
  sendspin-shareplay:
    image: ghcr.io/romkey/hackstack-sendspin-shairport-sync:latest
    # Build locally instead with: docker compose build
    build:
      context: .
      args:
        SHAIRPORT_SYNC_VERSION: "5.2.3"
        NQPTP_VERSION: "1.2.8"
        SENDSPIN_VERSION: "7.5.0"
    container_name: sendspin-shareplay
    restart: unless-stopped

    # AirPlay 2 needs mDNS and nqptp's fixed ports (319/320), so host networking
    # is required -- bridge networking will not work.
    network_mode: host

    # Lets Shairport Sync raise its own scheduling priority for stable timing.
    cap_add:
      - SYS_NICE
      # Required only for ENABLE_BLUETOOTH=1, which also needs the host's own
      # bluetooth service stopped. See the Bluetooth section of the README.
      #- NET_ADMIN

    devices:
      - "/dev/snd:/dev/snd"
      # Required only for ENABLE_BLUETOOTH=1, so the container can clear an
      # rfkill soft block. Without it the adapter cannot be powered on.
      #- "/dev/rfkill:/dev/rfkill"

    environment:
      # Sendspin, Bluetooth, Spotify, DLNA and the Home Assistant device all
      # default to this, so it is the only name that needs setting.
      AIRPLAY_NAME: "Living Room"

      # Raspberry Pi 3.5mm headphone jack. Check yours with:
      #   docker exec sendspin-shareplay aplay -l
      ALSA_PCM: "hw:Headphones,0"

      # dmix lets both players hold the sound card at once.
      # Use "exclusive" for bit-perfect output if only one source is ever active.
      AUDIO_SHARING: "dmix"
      ALSA_RATE: "44100"

      # The UI is on port 80. With host networking that must be free on the Pi.
      WEB_PORT: "80"
      TZ: "America/Los_Angeles"

      # Optional: pin a Sendspin server instead of relying on mDNS discovery.
      # SENDSPIN_URL: "ws://192.168.1.10:8927/sendspin"

    volumes:
      # Use the host's Avahi rather than running a second one. Raspberry Pi OS
      # runs avahi-daemon by default, and with host networking two daemons fight
      # over the same .local name, renaming each other in a loop. With these
      # mounted the container detects and uses the host's daemon.
      # Remove them only if the host has no avahi-daemon of its own.
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
      - ./config:/config

    logging:
      # Pinned explicitly: max-size and max-file are json-file/local options, and
      # passing them to a daemon whose default driver is journald fails with
      # "unknown log opt 'max-file'".
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
